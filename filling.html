<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
        }

        form {
            text-align: center;
            font-size: 30px;
        }

        input {
            width: 350px;
            height: 45px;
            font-size: 25px;
            border-radius: 8px;
            border: none;
            margin-bottom: 15px;
        }

        button {
            display: block;
            margin: 25px auto 0;
            width: 180px;
            height: 60px;
            background-color: violet;
            border: none;
            border-radius: 15px;
            cursor: pointer;
        }

        button a {
            color: white;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
            display: flex;
            width: 100%;
            height: 100%;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
